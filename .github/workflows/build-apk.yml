
name: Build NEON HALO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEON_HALO_Storage_Manager_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source ZIP
        run: unzip -o NEON_HALO_Storage_Manager_Source.zip

      - name: Build debug APK
        working-directory: NeonHaloStorage
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: neon-halo-storage-debug-apk
          path: NeonHaloStorage/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
